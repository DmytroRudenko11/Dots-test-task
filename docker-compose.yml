services:
  db:
    build: ./docker/postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    profiles: ["app"]
    environment:
      DATABASE_URL: postgres://shortener:shortener@db:5432/shortener
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
